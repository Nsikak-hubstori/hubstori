<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>hubstori</title>
<!-- FALLBACK: If someone shares main link, show main thumbnail. For post link, JS will swap to post thumbnail for browser. -->
<meta property="og:type" content="website">
<meta property="og:title" content=" ">
<meta property="og:description" content=" ">
<meta property="og:image" content="https://hubstori.vercel.app/thumbnail.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content=" ">
<meta name="twitter:description" content=" ">
<meta name="twitter:image" content="https://hubstori.vercel.app/thumbnail.jpg">
<style>body{background:#000;color:#fff;font-family:Arial;text-align:center;padding:20px;margin:0}img{width:100%;max-width:420px;border-radius:12px;object-fit:cover}a{background:#fe2c55;color:#fff;padding:14px 22px;border-radius:20px;text-decoration:none;display:inline-block;margin-top:18px;font-weight:bold}.top{font-weight:900;font-size:20px;margin-bottom:14px}.desc{font-size:14px;color:#ddd;line-height:1.5;max-width:420px;margin:12px auto}</style>
</head><body>
<div class="top">hubstori</div>
<img id="thumb" src="thumbnail.jpg">
<p class="desc" id="desc"></p>
<a id="watch" href="/">▶️ Watch on hubstori</a>
<script>
let params=new URLSearchParams(location.search);
let id=params.get('id');
fetch('videos.json').then(r=>r.json()).then(videos=>{
  let v=videos.find(x=>x.id===id);
  if(v){
    document.getElementById('thumb').src=v.thumbnail;
    document.getElementById('desc').textContent=v.desc;
    // Update share preview for browser (WhatsApp uses main thumbnail if shared as post.html link, but browser shows correct photo)
    document.title=' ';
  }
});
</script>
</body></html>
