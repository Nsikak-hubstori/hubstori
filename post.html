<script>
let params=new URLSearchParams(location.search);
let id=params.get('id') || 'NtUHWHdczEk';
fetch('videos.json').then(r=>r.json()).then(videos=>{
  let v=videos.find(x=>x.id===id);

  let src='';
  if(v.type==='tiktok'){
    src='https://www.tiktok.com/embed/v2/'+v.id+'?autoplay=1';
  } else {
    src='https://www.youtube.com/embed/'+v.id+'?autoplay=1&mute=0&rel=0';
  }
  this.innerHTML='<iframe src="'+src+'" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>';
};
